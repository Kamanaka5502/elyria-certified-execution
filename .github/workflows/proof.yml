name: Elyria Certified Execution Proof

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: certified-execution-validator-proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run C5 certification validator
        run: python certify.py examples/c5_cross_boundary_receipt.json

      - name: Run compact C5 certification validator
        run: python certify.py examples/c5_cross_boundary_receipt.json --compact

      - name: Run C4 certification validator
        run: python certify.py examples/c4_boundary_enforced_receipt.json

      - name: Run compact C4 certification validator
        run: python certify.py examples/c4_boundary_enforced_receipt.json --compact

      - name: Run C2 certification validator
        run: python certify.py examples/c2_receipt_bearing_receipt.json

      - name: Run compact C2 certification validator
        run: python certify.py examples/c2_receipt_bearing_receipt.json --compact

      - name: Run certification tests
        run: python test_certify.py
